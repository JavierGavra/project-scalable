<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style/dashboard.css" />
  <title>Dashboard — Puisi Nusantara</title>
</head>

<body>
  <!-- Header -->
  <header>
    <h1>My Poems</h1>
    <div class="user-info">
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main">
    <div class="toolbar">
      <h2>Koleksi Puisiku</h2>
      <div class="toolbar-right">
        <button class="btn-refresh" onclick="loadDaftarPuisi()">↻ Refresh</button>
        <a href="tambah_puisi.html" class="btn-tulis">Tulis Puisi</a>
      </div>
    </div>

    <div class="card">
      <div id="puisi-list">
        <div class="loading">Memuat puisi...</div>
      </div>
    </div>
  </div>

  <script>
    const BASE = "server.js";
    // const IMAGE_GEN_URL = "https://d6sqrxfc8ccan.cloudfront.net";
    let currentUser = null;

    window.onload = async () => {
      await loadCurrentUser();
      loadDaftarPuisi();
    };

    async function loadCurrentUser() {
      try {
        const res = await fetch(`${BASE}?action=me`, {
          method: "GET",
          credentials: "include"
        });
        if (res.ok) {
          const result = await res.json();
          currentUser = result.data;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function doLogout() {
      try {
        await fetch(`${BASE}?action=logout`, {
          method: "POST",
          credentials: "include",
        });
      } finally {
        window.location.href = "index.html";
      }
    }

    async function loadDaftarPuisi() {
      const listEl = document.getElementById("puisi-list");
      listEl.innerHTML = '<div class="loading">Memuat...</div>';

      try {
        const res = await fetch(`${BASE}?action=daftar_puisi`, {
          method: "GET",
          credentials: "include",
        });

        if (res.status === 401) {
          window.location.href = "index.html";
          return;
        }

        const data = await res.json();

        if (!data.data || data.data.length === 0) {
          listEl.innerHTML = `
            <div class="empty">
              Belum ada puisi tersimpan.<br>
              Klik <a href="tambah_puisi.html" style="color:#27ae60; font-weight:bold; text-decoration:none;">Tulis Puisi</a> untuk mulai menulis!
            </div>`;
          return;
        }

        listEl.innerHTML = data.data
          .map(
            (p) => {
              const bgName = p.background || "latar1";
              const textParam = encodeURIComponent(p.isi || "");
              const penulis = currentUser ? currentUser.nama : "Penulis";
              const imgSrc = `/fungsi?bg=${bgName}&judul=${encodeURIComponent(p.judul)}&bait=${textParam}&penulis=${encodeURIComponent(penulis)}`;

              return `
          <div class="puisi-item" title="${escapeHtml(p.judul)}">
            <img class="puisi-image" src="${imgSrc}" alt="${escapeHtml(p.judul)}" onerror="this.src='assets/${bgName}.jpeg'" />
          </div>
        `;
            }
          )
          .join("");
      } catch {
        listEl.innerHTML = '<div class="empty">Gagal memuat puisi.</div>';
      }
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric",
      });
    }

    function escapeHtml(s) {
      if (!s) return "";
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>

</html>
