  </div>

  <script>
    const BASE = "server.js";

    window.addEventListener("load", loadDaftarPuisi);

    async function doLogout() {
      try {
        await fetch(`${BASE}?action=logout`, {
          method: "POST",
          credentials: "include",
        });
      } finally {
        window.location.href = "index.html";
      }
    }

    async function loadDaftarPuisi() {
      const listEl = document.getElementById("puisi-list");
      listEl.innerHTML = '<div class="loading">Memuat...</div>';

      try {
        const res = await fetch(`${BASE}?action=daftar_puisi`, {
          method: "GET",
          credentials: "include",
        });

        if (res.status === 401) {
          window.location.href = "index.html";
          return;
        }

        const data = await res.json();

        if (!data.data || data.data.length === 0) {
          listEl.innerHTML = `
            <div class="empty">
              <div class="empty-icon" aria-hidden="true">✎</div>
              Belum ada puisi tersimpan.
              <br>
              <a href="tambah_puisi.html" class="empty-link">Tulis Puisi</a>
              untuk mulai menulis!
            </div>
          `;
          return;
        }

        listEl.innerHTML = data.data
          .map(
            (p) => `
              <article class="puisi-item">
                <div class="puisi-header">
                  <h3 class="puisi-judul">${escapeHtml(p.judul)}</h3>
                  <span class="badge">${escapeHtml(p.kategori)}</span>
                </div>

                <div class="puisi-meta">
                  <span aria-hidden="true">📅</span>
                  <time datetime="${escapeHtml(p.tgl_submit)}">
                    ${formatDate(p.tgl_submit)}
                  </time>
                </div>

                <div class="puisi-isi">${escapeHtml(p.isi)}</div>
              </article>
            `,
          )
          .join("");
      } catch {
        listEl.innerHTML = `
          <div class="empty">
            Gagal memuat puisi.
          </div>
        `;
      }
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric",
      });
    }

    function escapeHtml(s) {
      if (!s) return "";

      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
