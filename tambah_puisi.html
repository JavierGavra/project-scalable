  </div>

  <script>
    const BASE = "server.js";
    let currentUser = null;

    window.addEventListener("load", () => {
      document.getElementById("tgl_submit").value = new Date()
        .toISOString()
        .split("T")[0];

      loadCurrentUser();
    });

    async function doLogout() {
      try {
        await fetch(`${BASE}?action=logout`, {
          method: "POST",
          credentials: "include",
        });
      } finally {
        window.location.href = "index.html";
      }
    }

    async function loadCurrentUser() {
      try {
        const res = await fetch(`${BASE}?action=current_user`, {
          method: "GET",
          credentials: "include",
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || "Gagal mengambil data user");
        }

        currentUser = result.data;
        updatePreview();
      } catch (error) {
        console.error("Gagal mengambil user:", error);
      }
    }

    function wrapText(ctx, text, maxWidth) {
      const words = text.split(/\s+/);
      const lines = [];
      let line = "";

      for (const word of words) {
        const testLine = line ? `${line} ${word}` : word;
        const width = ctx.measureText(testLine).width;

        if (width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = testLine;
        }
      }

      if (line) {
        lines.push(line);
      }

      return lines;
    }

    async function doSubmitPuisi() {
      const alertEl = document.getElementById("submit-alert");
      const judul = document.getElementById("judul").value.trim();
      const tgl_submit = document.getElementById("tgl_submit").value;
      const kategori = document.getElementById("kategori").value;
      const keyword = document.getElementById("keyword").value.trim();
      const isi = document.getElementById("isi").value.trim();

      if (!judul || !tgl_submit || !kategori || !isi) {
        return showAlert(
          alertEl,
          "Judul, tanggal, kategori, dan isi puisi wajib diisi!",
          "error"
        );
      }

      const btn = document.getElementById("btn-simpan");
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      try {
        const res = await fetch(`${BASE}?action=submit_puisi`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          credentials: "include",
          body: JSON.stringify({
            judul,
            tgl_submit,
            kategori,
            keywords: keyword,
            isi,
          }),
        });

        if (res.status === 401) {
          showAlert(
            alertEl,
            "Sesi habis, silakan login kembali",
            "error"
          );

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1200);

          return;
        }

        const data = await res.json();

        if (res.ok) {
          showAlert(
            alertEl,
            (data.message || "Puisi berhasil disimpan!") + " Mengalihkan...",
            "success"
          );

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } else {
          showAlert(
            alertEl,
            data.error || "Gagal menyimpan puisi",
            "error"
          );

          btn.disabled = false;
          btn.textContent = "Simpan Puisi";
        }
      } catch {
        showAlert(
          alertEl,
          "Gagal terhubung ke server",
          "error"
        );

        btn.disabled = false;
        btn.textContent = "Simpan Puisi";
      }
    }

    function updatePreview() {
      const judul = document.getElementById("judul").value.trim();
      const penggalan = document.getElementById("penggalan").value.trim();
      const template = document.getElementById("template").value;
      const preview = document.getElementById("preview-gambar");

      const penulis = currentUser
        ? currentUser.nama
        : "Penulis";

      const img = new Image();

      img.onload = function () {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        ctx.drawImage(img, 0, 0);

        const W = canvas.width;
        const H = canvas.height;
        const centerX = W / 2;
        const padding = W * 0.10;
        const maxWidth = W - (padding * 2);

        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillStyle = "black";

        const titleSize = Math.max(18, Math.min(W * 0.05, 28));
        ctx.font = `bold ${titleSize}px Arial`;

        let y = H * 0.18;

        const titleLines = wrapText(
          ctx,
          judul || "Judul Puisi",
          maxWidth
        );

        titleLines.slice(0, 2).forEach(line => {
          ctx.fillText(line, centerX, y);
          y += titleSize * 1.15;
        });

        const authorSize = Math.max(11, Math.min(W * 0.025, 16));
        ctx.font = `${authorSize}px Arial`;

        y += H * 0.02;

        ctx.fillText(
          `Oleh: ${penulis}`,
          centerX,
          y
        );

        const bodySize = Math.max(11, Math.min(W * 0.028, 17));
        ctx.font = `italic ${bodySize}px Arial`;

        y += authorSize * 1.8;

        const bodyLines = wrapText(
          ctx,
          penggalan || "Penggalan bait puisi...",
          maxWidth
        );

        const lineHeight = bodySize * 1.4;

        bodyLines.slice(0, 5).forEach(line => {
          ctx.fillText(line, centerX, y);
          y += lineHeight;
        });

        preview.src = canvas.toDataURL(
          "image/jpeg",
          0.92
        );

        preview.alt = judul
          ? `Preview puisi: ${judul}`
          : "Preview gambar puisi";
      };

      img.onerror = function () {
        console.error("Gagal memuat template:", template);
        preview.src = template;
      };

      img.src = template;
    }

    function showAlert(el, msg, type) {
      el.textContent = msg;
      el.className = `alert ${type}`;
      el.style.display = "flex";
    }

    document.getElementById("judul").addEventListener("input", updatePreview);
    document.getElementById("penggalan").addEventListener("input", updatePreview);
    document.getElementById("template").addEventListener("change", updatePreview);
  </script>
