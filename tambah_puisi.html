<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style/tambah_puisi.css" />
  <title>Tulis Puisi — Puisi Nusantara</title>
</head>

<body>
  <!-- Header -->
  <header>
    <h1><a href="dashboard.html">My Poems</a></h1>
    <div class="user-info">
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main">
    <div class="nav-bar">
      <a href="dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Tulis Puisi Baru</h2>
        <p>Tuangkan bait-bait karya sastra dan inspirasi Anda di sini.</p>
      </div>

      <div id="submit-alert" class="alert"></div>

      <div class="form-group">
        <label for="judul">Judul Puisi</label>
        <input type="text" id="judul" placeholder="Tulis judul puisi Anda..." autofocus />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tgl_submit">Tanggal Submit</label>
          <input type="date" id="tgl_submit" />
        </div>
        <div class="form-group">
          <label for="kategori">Kategori</label>
          <select id="kategori">
            <option value="">-- Pilih Kategori --</option>
            <option value="Alam">Alam</option>
            <option value="Cinta">Cinta</option>
            <option value="Patriotisme">Patriotisme</option>
            <option value="Religi">Religi</option>
            <option value="Sosial">Sosial</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="keyword">Kata Kunci (pisahkan dengan koma)</label>
        <input type="text" id="keyword" placeholder="contoh: senja, rindu, kenangan" />
      </div>

      <div class="form-group">
        <label for="isi">Isi Puisi</label>
        <textarea id="isi" placeholder="Tuliskan bait puisi Anda di sini..."></textarea>
      </div>
      <div class="form-group">
        <label for="penggalan">Penggalan Bait untuk Gambar</label>
        <textarea id="penggalan" placeholder="Masukkan penggalan bait yang akan ditampilkan pada gambar..."
          rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="template">Pilih Template Gambar</label>
        <select id="template" onchange="updatePreview()">
          <option value="latar1.jpeg">Template 1</option>
          <option value="latar2.jpeg">Template 2</option>
          <option value="latar3.jpeg">Template 3</option>
          <option value="latar5.jpeg">Template 4</option>
        </select>
      </div>

      <div class="preview-section">
        <h3>Preview Gambar Puisi</h3>

        <div class="preview-container">
          <img id="preview-gambar" src="latar1.jpeg" alt="Preview gambar puisi" />
        </div>

        <p class="preview-info">
          Preview akan menampilkan judul, penulis, dan penggalan bait.
        </p>
      </div>
      <div class="form-actions">
        <a href="dashboard.html" class="btn-batal">Batal</a>
        <button class="btn-simpan" id="btn-simpan" onclick="doSubmitPuisi()">
          Simpan Puisi
        </button>
      </div>
    </div>
  </div>

  <script>
    const BASE = "server.js";
    // const IMAGE_GEN_URL = "https://d6sqrxfc8ccan.cloudfront.net";

    window.onload = () => {
      document.getElementById("tgl_submit").value = new Date()
        .toISOString()
        .split("T")[0];
    };

    async function doLogout() {
      try {
        await fetch(`${BASE}?action=logout`, {
          method: "POST",
          credentials: "include",
        });
      } finally {
        window.location.href = "index.html";
      }
    }
    let currentUser = null;

    async function loadCurrentUser() {
      try {
        const res = await fetch(`${BASE}?action=me`, {
          method: "GET",
          credentials: "include"
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || "Gagal mengambil data user");
        }

        currentUser = result.data;

        console.log("User login:", currentUser);

        updatePreview();
      } catch (error) {
        console.error("Gagal mengambil user:", error);
      }
    }
    function wrapText(ctx, text, maxWidth) {
      const words = text.split(/\s+/);
      const lines = [];
      let line = "";

      for (const word of words) {
        const testLine = line
          ? `${line} ${word}`
          : word;

        const width = ctx.measureText(testLine).width;

        if (width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = testLine;
        }
      }

      if (line) {
        lines.push(line);
      }

      return lines;
    }


    async function doSubmitPuisi() {
      const alertEl = document.getElementById("submit-alert");
      const judul = document.getElementById("judul").value.trim();
      const tgl_submit = document.getElementById("tgl_submit").value;
      const kategori = document.getElementById("kategori").value;
      const keyword = document.getElementById("keyword").value.trim();
      const isi = document.getElementById("isi").value.trim();

      if (!judul || !tgl_submit || !kategori || !isi) {
        return showAlert(
          alertEl,
          "Judul, tanggal, kategori, dan isi puisi wajib diisi!",
          "error"
        );
      }

      const btn = document.getElementById("btn-simpan");
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      try {
        const templateSelect = document.getElementById("template").value;
        const bgName = templateSelect.replace(/\.[^/.]+$/, "");

        const res = await fetch(`${BASE}?action=submit_puisi`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            judul: judul,
            tgl_submit: tgl_submit,
            kategori: kategori,
            keywords: keyword,
            isi: isi,
            background: bgName,
          }),
        });

        if (res.status === 401) {
          showAlert(alertEl, "Sesi habis, silakan login kembali", "error");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1200);
          return;
        }

        const data = await res.json();

        if (res.ok) {
          showAlert(
            alertEl,
            (data.message || "Puisi berhasil disimpan!") + " Mengalihkan...",
            "success"
          );
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } else {
          showAlert(alertEl, data.error || "Gagal menyimpan puisi", "error");
          btn.disabled = false;
          btn.textContent = "Simpan Puisi";
        }
      } catch {
        showAlert(alertEl, "Gagal terhubung ke server", "error");
        btn.disabled = false;
        btn.textContent = "Simpan Puisi";
      }
    }

    function showAlert(el, msg, type) {
      el.textContent = msg;
      el.className = `alert ${type}`;
      el.style.display = "block";
    }
    function updatePreview() {
      const judul = document.getElementById("judul").value.trim();
      const penggalan = document.getElementById("penggalan").value.trim();
      const templateSelect = document.getElementById("template").value;
      const preview = document.getElementById("preview-gambar");

      // Extract template name without extension
      const bgName = templateSelect.replace(/\.[^/.]+$/, "");

      // Use fallback text if empty, to show a meaningful preview
      const textParam = encodeURIComponent(penggalan || "Penggalan bait puisi...");

      // Set the src to the CDN URL
      preview.src = `/fungsi?bg=${bgName}&judul=${judul}&bait=${textParam}&penulis=${currentUser.nama}`;

      preview.alt = judul
        ? `Preview puisi: ${judul}`
        : "Preview gambar puisi";
    }
    loadCurrentUser();
    document.getElementById("judul").addEventListener("input", updatePreview);

    document.getElementById("penggalan").addEventListener("input", updatePreview);

    document.getElementById("template").addEventListener("change", updatePreview);
  </script>
</body>

</html>
